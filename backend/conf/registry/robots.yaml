# Robot registry. Each entry describes a MuJoCo Menagerie arm and everything the platform needs to
# compose a scene, bake trajectories, compare state and talk to its ROS 2 stack.
robots:
  franka_panda:
    name: Franka Emika Panda (7-DoF)
    mjcf: franka_emika_panda/panda.xml
    joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
    actuators: [actuator1, actuator2, actuator3, actuator4, actuator5, actuator6, actuator7]
    home: [-0.2078, -0.5063, 0.16, -2.1769, 0.0778, 1.6756, 0.7095]
    effort_limits: [87, 87, 87, 87, 12, 12, 12]
    ee_body: hand
    ee_offset: [0, 0, 0.1034]
    ee_quat: [1, 0, 0, 0]
    gripper: {type: model, actuator: actuator8, joints: [finger_joint1, finger_joint2], open: 255, closed: 0, ctrl_open: 255, ctrl_closed: 0}
    wrist_camera: {body: hand, pos: [0.07, 0, 0.02], quat: [0, 1, 0, 0], fovy: 75}
    pedestal_height: 1.05
    reach_m: 0.85
    thresholds: {max_joint_velocity: 1.0}
    ros2: {command_topic: /joint_trajectory_controller/joint_trajectory, joint_states_topic: /joint_states, controller: joint_trajectory_controller}
  franka_fr3:
    name: Franka Research 3 (7-DoF)
    mjcf: franka_fr3/fr3.xml
    joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    actuators: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    home: [-0.2078, -0.5063, 0.16, -2.1769, 0.0778, 1.6756, 0.7095]
    effort_limits: [87, 87, 87, 87, 12, 12, 12]
    ee_body: fr3_link7
    ee_offset: [0, 0, 0.107]
    ee_quat: [0.9238795, 0, 0, -0.3826834]
    gripper: {type: builtin}
    wrist_camera: {body: fr3_link7, pos: [0.07, 0, 0.13], quat: [0, 1, 0, 0], fovy: 75}
    pedestal_height: 1.05
    reach_m: 0.85
    thresholds: {max_joint_velocity: 1.0}
    ros2: {command_topic: /joint_trajectory_controller/joint_trajectory, joint_states_topic: /joint_states, controller: joint_trajectory_controller}
  ur5e:
    name: Universal Robots UR5e (6-DoF)
    mjcf: universal_robots_ur5e/ur5e.xml
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    actuators: [shoulder_pan, shoulder_lift, elbow, wrist_1, wrist_2, wrist_3]
    home: [2.8394, -1.7028, 1.5215, -1.3894, -1.5708, -1.8729]
    effort_limits: [150, 150, 150, 28, 28, 28]
    ee_body: wrist_3_link
    ee_offset: [0, 0.1, 0]
    ee_quat: [-0.7071068, 0.7071068, 0, 0]
    gripper: {type: builtin}
    wrist_camera: {body: wrist_3_link, pos: [0.06, 0.06, 0.0], quat: [0.5, 0.5, 0.5, 0.5], fovy: 75}
    pedestal_height: 1.05
    reach_m: 0.85
    thresholds: {max_joint_velocity: 1.0}
    ros2: {command_topic: /scaled_joint_trajectory_controller/joint_trajectory, joint_states_topic: /joint_states, controller: scaled_joint_trajectory_controller}
  ur10e:
    name: Universal Robots UR10e (6-DoF)
    mjcf: universal_robots_ur10e/ur10e.xml
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    actuators: [shoulder_pan, shoulder_lift, elbow, wrist_1, wrist_2, wrist_3]
    home: [2.7447, -2.0286, 2.1619, -1.7041, -1.5709, -1.9676]
    effort_limits: [330, 330, 150, 56, 56, 56]
    ee_body: wrist_3_link
    ee_offset: [0, 0.1, 0]
    ee_quat: [-0.7071068, 0.7071068, 0, 0]
    gripper: {type: builtin}
    wrist_camera: {body: wrist_3_link, pos: [0.06, 0.06, 0.0], quat: [0.5, 0.5, 0.5, 0.5], fovy: 75}
    pedestal_height: 1.05
    reach_m: 1.3
    thresholds: {max_joint_velocity: 1.0}
    ros2: {command_topic: /scaled_joint_trajectory_controller/joint_trajectory, joint_states_topic: /joint_states, controller: scaled_joint_trajectory_controller}
