# Machine registry. Each entry describes a machine tool the cell can be built around: the meshes that
# draw it, where the part sits, and the real-world dimensions the scenario zones derive from.
# A scenario selects one with `machine: {ref: <id>}`.
#
# Each machine is imported from manufacturer CAD (SolidWorks STEP) by backend/scripts/cad_machine.py,
# which keeps one mesh per colour in the source model so the render matches the real machine. Those
# meshes are visual only: MuJoCo collides a mesh as its convex hull, so a hollow enclosure imported as
# one mesh would be a solid block. Collision comes from primitives in each machine's XML.
#
# Every model must expose the contract the adapter drives:
#   joints  cnc_door_joint, cnc_jaw_l_joint, cnc_jaw_r_joint
#   site    cnc_chuck_site
#   body    cnc_machine      (placed at the scenario's machine pose)
machines:
  haas_vf2_cad:
    # imported: cad_machine.py backend/cad/haas-vf2/CNC.STEP --name haas_vf2_cad
    name: Haas VF-2 (vertical machining centre)
    mjcf: haas_vf2_cad.xml
    meshes: {haas_vf2_cad_0: {file: haas_vf2_cad/haas_vf2_cad_0.msh, rgba: [0.2431, 0.2627, 0.2627, 1.0]}, haas_vf2_cad_1: {file: haas_vf2_cad/haas_vf2_cad_1.msh, rgba: [0.2078, 0.2078, 0.2078, 1.0]}, haas_vf2_cad_2: {file: haas_vf2_cad/haas_vf2_cad_2.msh, rgba: [0.0706, 0.0706, 0.0706, 1.0]}, haas_vf2_cad_3: {file: haas_vf2_cad/haas_vf2_cad_3.msh, rgba: [0.4039, 0.4471, 0.5529, 1.0]}, haas_vf2_cad_4: {file: haas_vf2_cad/haas_vf2_cad_4.msh, rgba: [1.0, 1.0, 1.0, 1.0]}, haas_vf2_cad_5: {file: haas_vf2_cad/haas_vf2_cad_5.msh, rgba: [0.0078, 0.0078, 0.0078, 1.0]}, haas_vf2_cad_6: {file: haas_vf2_cad/haas_vf2_cad_6.msh, rgba: [0.7843, 0.8235, 0.8471, 1.0]}, haas_vf2_cad_7: {file: haas_vf2_cad/haas_vf2_cad_7.msh, rgba: [0.7765, 0.8157, 0.8471, 1.0]}}
    dimensions: {width: 2.504, depth: 2.325, height: 2.278, enclosure_height: 1.93}
    door: {opening_width: 0.94, travel: 0.94, axis: y, panels: 2, clear_top: 1.88}
    table: {width: 0.72, depth: 0.36, height: 0.83, jaw_clamped: 0.055}
    travels: {x: 0.762, y: 0.406, z: 0.508}
    spindle: {taper: "CT/BT 40", max_rpm: 8100, power_kw: 22.4}
    tool_changer: {type: umbrella, stations: 20}
    chuck_offset: [-0.62, 0.0, 0.942]
    # measured off the tessellated shell: behind the door, above the bed, inside the side walls
    work_volume: {min: [-0.95, -0.92, 0.78], max: [0.40, 0.84, 1.75]}
    front_offset: -1.162
    max_table_load_kg: 680

