# Machine registry. Each entry describes a machine tool the cell can be built around: the meshes that
# draw it, where the part sits, and the real-world dimensions the scenario zones derive from.
# A scenario selects one with `machine: {ref: <id>}`.
#
# Each machine is imported from manufacturer CAD (SolidWorks STEP) by backend/scripts/cad_step.py,
# which keeps one mesh per colour in the source model so the render matches the real machine. Those
# meshes are visual only: MuJoCo collides a mesh as its convex hull, so a hollow enclosure imported as
# one mesh would be a solid block. Collision comes from primitives in each machine's XML.
#
# A few `rgba` values are overridden against the CAD: these files carry SolidWorks' working
# appearances rather than the painted machine, so the largest shell groups are repainted to the
# Haas livery (light grey sheet metal over a dark charcoal base). Search for "repainted" below.
#
# Every model must expose the contract the adapter drives:
#   joints  cnc_door_joint, cnc_jaw_l_joint, cnc_jaw_r_joint
#   site    cnc_chuck_site
#   body    cnc_machine      (placed at the scenario's machine pose)
machines:
  haas_vf1:
