id: cnc_tending
name: CNC machine tending
description: Unload a finished part from the CNC when its cycle completes, load a raw block, clamp, close the door and start the next cycle. An operator works alongside the cell.
targets:
  rogue: [0.28, 0.62, 0.20]     # a lunge toward the operator lane (fault B)
trays:
  - {id: raw_tray, pose: [0.0, -0.46, -0.1], slots: [[-0.12, 0.0], [-0.04, 0.0], [0.04, 0.0], [0.12, 0.0]]}
  - {id: finished_tray, pose: [-0.02, 0.46, -0.1], slots: [[-0.12, 0.0], [-0.04, 0.0], [0.04, 0.0], [0.12, 0.0]]}
# Raw stock is square; a finished part is a turned cylinder, so the output of the CNC is
# recognisable at a glance -- four raw blocks in, four cylinders out.
blocks:
  - {id: raw-1, pose: [-0.12, -0.46, -0.06], size: 0.03, mass: 0.6}
  - {id: raw-2, pose: [-0.04, -0.46, -0.06], size: 0.03, mass: 0.6}
  - {id: raw-3, pose: [0.04, -0.46, -0.06], size: 0.03, mass: 0.6}
  - {id: raw-4, pose: [0.12, -0.46, -0.06], size: 0.03, mass: 0.6}
  - {id: part-0, pose: [0.742, 0.0, -0.108], size: 0.028, height: 0.032, mass: 0.5, finished: true, shape: cylinder}
machine:
  id: cnc-1
  ref: haas_vf1                  # backend/conf/machines/machines.yaml (manufacturer CAD)
  # Origin at floor level, x set so the front face keeps the same 0.2 m clearance from the robot
  # riser as before: the VF-1's front_offset is -1.568 (its CAD includes the coolant tank and chip
  # auger), against the VF-2's -1.162, so the machine sits further back than that model did.
  pose: [1.7680, 0.0, -1.05]
  cycle_time_s: 12
  chuck_offset: [-0.56, 0.0, 0.942]  # vise on the CAD table, inside the door (VF-1 table is
                                     # smaller than the VF-2's, so the vise sits 60 mm further in)
  protocol: simulated
  allowed_clients: [/motion_planner, cell_plc]
human:
  # the operator works the aisle outside the painted cell boundary, never through the machine
  pose: [-0.6, 2.47, 0.2]
  behaviour: operator_patrol
  patrol: [[-1.05, 2.47], [2.72, 2.47]]
  speed: 0.3
zones:
  # The arm's range of motion. An operator inside it must stop the robot (auto-resume on exit).
  - {id: robot_rom, type: reach_envelope, protective_stop: true, stop_within_s: 0.5}
  # bounds omitted: resolved from the machine profile's enclosed working volume
  - {id: cnc_interior, type: restricted_while, condition: "machine.state == RUNNING"}
sensors: []
task:
  loop: true
  cycles: 4          # four raw blocks -> four finished parts, then the run ends
  steps:
    - {id: wait_cycle,  action: wait, precondition: "machine.state == COMPLETE", timeout_s: 40, duration_s: 12, on_fail: open_door}
    - {id: open_door,   action: machine, command: door_open, expect: "machine.door == OPEN", duration_s: 3}
    - {id: to_front_0,  action: move, target: machine.front, gripper: open, duration_s: 3}
    - {id: to_chuck,    action: move, target: machine.chuck_above, duration_s: 4}
    - {id: grasp_part,  action: move, target: machine.chuck, duration_s: 3}
    - {id: close_grip,  action: gripper, gripper: closed, duration_s: 1}
    - {id: unclamp,     action: machine, command: unclamp, expect: "machine.chuck == OPEN", duration_s: 1}
    - {id: lift_part,   action: move, target: machine.chuck_above, duration_s: 3}
    - {id: to_front,    action: move, target: machine.front, duration_s: 3}
    - {id: unload,      action: move, target: finished_tray.next, height_offset: 0.15, duration_s: 5}
    - {id: set_down,    action: move, target: finished_tray.next, height_offset: 0.02, duration_s: 2}
    - {id: release,     action: gripper, gripper: open, duration_s: 1}
    - {id: up_from_tray, action: move, target: finished_tray.next, height_offset: 0.15, duration_s: 2}
    - {id: to_raw,      action: move, target: raw_tray.next, height_offset: 0.15, duration_s: 5}
    - {id: pick_raw,    action: move, target: raw_tray.next, duration_s: 2}
    - {id: grip_raw,    action: gripper, gripper: closed, duration_s: 1}
    - {id: lift_raw,    action: move, target: raw_tray.next, height_offset: 0.15, duration_s: 2}
    - {id: to_front_2,  action: move, target: machine.front, duration_s: 4}
    - {id: to_chuck_2,  action: move, target: machine.chuck_above, duration_s: 4}
    - {id: load,        action: move, target: machine.chuck, height_offset: 0.02, duration_s: 3}
    - {id: clamp,       action: machine, command: clamp, expect: "machine.chuck == CLAMPED", duration_s: 1}
    - {id: open_grip,   action: gripper, gripper: open, duration_s: 1}
    - {id: retreat,     action: move, target: machine.chuck_above, duration_s: 3}
    - {id: go_home,     action: move, target: machine.front, duration_s: 3}
    - {id: close_door,  action: machine, command: door_close, expect: "machine.door == CLOSED", duration_s: 3}
    - {id: start_cycle, action: machine, command: cycle_start, expect: "machine.state == RUNNING", duration_s: 1, on_fail: open_door}
faults:
  A: {name: Excessive velocity, expected_detection: JOINT_VELOCITY_LIMIT_EXCEEDED, description: "Controller executes trajectories 2.5x faster than commanded.", params: {speed_factor: 2.5}, duration_s: 10}
  B: {name: Unexpected command source, expected_detection: UNEXPECTED_COMMAND_SOURCE, description: "A rogue node publishes a trajectory that swings the arm toward the operator lane.", params: {rogue_node: /teleop_override, goal: rogue, rate_hz: 10, duration_s: 2.0}, duration_s: 9}
  C: {name: Sensor disagreement, expected_detection: SENSOR_STATE_DIVERGENCE, description: "joint 2 encoder reports +0.25 rad relative to the physical joint.", params: {encoder_offset: {joint: 1, rad: 0.25}}, duration_s: 10}
  D: {name: Trajectory deviation, expected_detection: TRAJECTORY_DIVERGENCE, description: "Joints 2 and 4 lose 95% of position gain; the arm sags under gravity.", params: {actuator_gain_scale: 0.05, joints: [1, 3]}, duration_s: 10}
  E: {name: Collision, expected_detection: COLLISION_EVENT, description: "Planner goal placed into the machine bed beside the chuck with the collision check disabled; the gripper drives into the bed.", params: {goal: machine.obstacle, disable_collision_check: true}, duration_s: 12}
  F: {name: Machine state spoof, expected_detection: MACHINE_STATE_MISMATCH, description: "The planner's copy of the machine state is spoofed to COMPLETE while the spindle is still RUNNING; the robot opens the door and enters the interior.", params: {machine_state_spoof: COMPLETE}, duration_s: 20}
  G: {name: Operator intrusion, expected_detection: PROTECTIVE_STOP_OBSERVED, description: "The operator walks into the robot's range of motion while the arm moves; the cell must issue a protective stop and resume once they are clear.", params: {human_behaviour: operator_intrusion}, duration_s: 14}
  I: {name: Unexpected load, expected_detection: UNEXPECTED_LOAD, description: "A 3 kg mass is attached to the wrist without the planner's knowledge; joint torques diverge from the shadow model.", params: {extra_payload_kg: 3.0}, duration_s: 12}
